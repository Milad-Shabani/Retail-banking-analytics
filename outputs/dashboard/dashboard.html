<style>
  :root{
    --ink:#0B1F3A; --ink-soft:#33404F; --line:#E3E8EF; --panel:#F7F9FC; --paper:#FFFFFF;
    --accent:#0F6E5D; --accent-soft:#E4F2EE; --gold:#B8862B; --gold-soft:#FBF2E2;
    --brick:#B23A48; --brick-soft:#FBEAEC; --muted:#7A8699;
    --shadow: 0 1px 2px rgba(15,31,58,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink-soft);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px;}
  h1,h2,h3,.num{font-family:'Manrope',system-ui,sans-serif;}
  a{color:inherit;}
  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:248px; flex-shrink:0; background:var(--ink); color:#DCE4F0; position:sticky; top:0; height:100vh; overflow-y:auto; padding:22px 14px;}
  .brand{padding:4px 10px 20px 10px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:14px;}
  .brand .mark{font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; color:#fff; letter-spacing:0.2px;}
  .brand .sub{font-size:11px; color:#8FA0BE; margin-top:4px; line-height:1.5;}
  .nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:#5E7093; padding:14px 10px 6px;}
  .nav-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:7px; cursor:pointer; font-size:13px; color:#B9C6DC; margin-bottom:1px;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:var(--accent); color:#fff; font-weight:600;}
  .nav-dot{width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.55; flex-shrink:0;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0;}
  .topbar{position:sticky; top:0; z-index:5; background:rgba(255,255,255,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .topbar h1{font-size:18px; margin:0; color:var(--ink); font-weight:700;}
  .topbar .subtitle{font-size:12px; color:var(--muted); margin-top:2px;}
  .filters{display:flex; gap:10px; align-items:center;}
  .filters select{font-family:inherit; font-size:12.5px; padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink-soft);}
  .disclaimer{background:var(--gold-soft); border-bottom:1px solid #EFD9AA; color:#6B4E14; font-size:11.5px; padding:7px 28px; text-align:center;}

  .content{padding:26px 28px 60px;}
  .section{display:none;}
  .section.active{display:block;}
  .section-head{margin-bottom:18px;}
  .section-head h2{font-size:20px; color:var(--ink); margin:0 0 4px;}
  .section-head p{font-size:12.5px; color:var(--muted); margin:0; max-width:760px; line-height:1.5;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-bottom:22px;}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .kpi .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .kpi .num{font-size:21px; font-weight:800; color:var(--ink);}
  .kpi .delta{font-size:11px; margin-top:5px; font-weight:600;}
  .kpi .delta.up{color:var(--accent);}
  .kpi .delta.down{color:var(--brick);}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:16px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px;}
  .grid-2, .grid-3{align-items:stretch;}
  @media (max-width: 900px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

  .card{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow);}
  .card h3{font-size:13px; margin:0 0 12px; color:var(--ink); font-weight:700;}
  .card .chart-wrap{position:relative; height:250px;}
  .card .chart-wrap.tall{height:320px;}
  .card .chart-wrap.short{height:190px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:8px 10px; border-bottom:1px solid #F0F2F6; color:var(--ink-soft);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600;}
  .tag.low{background:var(--accent-soft); color:var(--accent);}
  .tag.mod{background:var(--gold-soft); color:var(--gold);}
  .tag.high{background:var(--brick-soft); color:var(--brick);}

  .insight-list{list-style:none; margin:0; padding:0;}
  .insight-list li{padding:9px 0; border-bottom:1px solid #F0F2F6; font-size:12.5px; line-height:1.5; padding-left:16px; position:relative;}
  .insight-list li:before{content:"—"; position:absolute; left:0; color:var(--accent); font-weight:700;}
  .insight-list li:last-child{border-bottom:none;}

  .badge-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .badge{font-size:11px; background:var(--panel); border:1px solid var(--line); padding:4px 10px; border-radius:20px; color:var(--ink-soft);}

  .footer-author{margin-top:40px; border-top:1px solid var(--line); padding-top:28px; display:flex; align-items:center; gap:18px;}
  .footer-author img{width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid var(--line);}
  .footer-author .name{font-weight:800; color:var(--ink); font-size:15px;}
  .footer-author .role{font-size:12px; color:var(--muted); margin-top:2px;}
  .footer-author .links{font-size:12px; margin-top:6px;}
  .footer-author .links a{color:var(--accent); text-decoration:none; margin-right:14px; font-weight:600;}

  .scenario-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .scenario-tab{padding:6px 12px; border-radius:20px; font-size:12px; border:1px solid var(--line); cursor:pointer; background:#fff; color:var(--ink-soft);}
  .scenario-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  @media (max-width: 760px){
    .sidebar{position:fixed; left:-260px; transition:left .2s; z-index:20;}
    .sidebar.open{left:0;}
    .topbar{padding:12px 16px;} .content{padding:16px;}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">Retail Banking Analytics</div>
      <div class="sub">Customer Intelligence · Financial Performance<br>Risk · Churn · Forecasting</div>
    </div>
    <div id="nav-list"></div>
  </nav>

  <div class="main">
    <div class="disclaimer">Synthetic data for educational &amp; portfolio purposes only — not a real bank, not investment advice, not a regulatory model.</div>
    <div class="topbar">
      <div>
        <h1 id="section-title">Executive Overview</h1>
        <div class="subtitle" id="section-subtitle">Bank-wide KPIs and trends</div>
      </div>
      <div class="filters">
        <select id="filter-region"><option value="">All Regions</option></select>
        <select id="filter-digital"><option value="">All Digital Segments</option></select>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

function chartWrap(id, tall="") { return `<div class="chart-wrap ${tall}"><canvas id="${id}"></canvas></div>`; }
function riskTag(bucket){
  const cls = ["Low"].includes(bucket) ? "low" : ["Moderate","Elevated"].includes(bucket) ? "mod" : "high";
  return `<span class="tag ${cls}">${bucket}</span>`;
}

function renderIranMap(geo, containerId){
  const values = geo.provinces.map(p=>p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const colorFor = (v) => {
    const t = (v-min)/(max-min || 1);
    const r1=228,g1=242,b1=238, r2=15,g2=110,b2=93;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    return `rgb(${r},${g},${b})`;
  };
  let svg = `<svg viewBox="0 0 ${geo.width} ${geo.height}" style="width:100%;height:auto;max-height:440px" xmlns="http://www.w3.org/2000/svg">`;
  geo.provinces.forEach(p=>{
    const fill = colorFor(p.value);
    svg += `<path d="${p.path}" fill="${fill}" stroke="#FFFFFF" stroke-width="1.2">
      <title>${p.name}: ${p.value}</title>
    </path>`;
  });
  svg += `</svg>`;
  document.getElementById(containerId).innerHTML = svg;
}

      ${kpiCard("Profit (Month 12)", fmtMoney(r.path[r.path.length-1].profit))}
      ${kpiCard("Cumulative 12M Profit", fmtMoney(r.cumulative_12m_profit))}
      ${kpiCard("Annualized ROA (M12)", fmtPct(r.roa_annualized_m12))}
      ${kpiCard("Deposits (Month 12)", fmtMoney(r.path[r.path.length-1].deposits))}
      ${kpiCard("Loans (Month 12)", fmtMoney(r.path[r.path.length-1].loans))}
    `;
    destroyCharts();
    mkChart(document.getElementById("chart-scenario"), {type:"line",
      data:{labels:r.path.map(p=>"M"+p.month_ahead), datasets:[
        {label:"Profit", data:r.path.map(p=>p.profit), borderColor:PALETTE.series[0], tension:0.2},
        {label:"Revenue", data:r.path.map(p=>p.revenue), borderColor:PALETTE.series[2], tension:0.2},
        {label:"Credit Loss", data:r.path.map(p=>-p.credit_loss), borderColor:PALETTE.brick, tension:0.2},
      ]}, options:baseLineOpts(true)});
  }
  document.querySelectorAll(".scenario-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".scenario-tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      showScenario(tab.dataset.scenario);
    });
  });
  showScenario(names[0]);
}

// ---------------------------------------------------------------------------
// CHART OPTION HELPERS
// ---------------------------------------------------------------------------
function baseLineOpts(showLegend=true, percent=false, suffix=""){
  return {responsive:true, maintainAspectRatio:false,
    interaction:{mode:"index", intersect:false},
    plugins:{legend:{display:showLegend, position:"bottom", labels:{boxWidth:10,font:{size:11}}}},
    scales:{ y:{ ticks:{ callback:(v)=> percent ? (v*100).toFixed(0)+"%" : (suffix==="%" ? v+"%" : (Math.abs(v)>=1000?fmtMoney(v):v)) },
                 grid:{color:PALETTE.line} },
             x:{ grid:{display:false} } } };
}
function baseBarOpts(suffix=""){
  return {responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{ y:{ ticks:{ callback:(v)=> suffix==="%" ? v+"%" : (suffix==="$" && Math.abs(v)>=1000?fmtMoney(v):fmtNum(v)) }, grid:{color:PALETTE.line} },
             x:{ grid:{display:false} } } };
}
function baseBarOptsH(suffix=""){
  return {responsive:true, maintainAspectRatio:false, indexAxis:"y",
    plugins:{legend:{display:false}},
    scales:{ x:{ ticks:{ callback:(v)=> suffix==="%" ? v+"%" : (suffix==="$" && Math.abs(v)>=1000?fmtMoney(v):fmtNum(v)) }, grid:{color:PALETTE.line} },
             y:{ grid:{display:false} } } };
}

// APP SHELL: nav, filters, section switching
// ---------------------------------------------------------------------------
const RENDERERS = {
  executive: (d)=>renderExecutive(d),
  financial: (d)=>renderFinancial(d),
  customers: (d,rg)=>renderCustomers(d,rg),
  segmentation: (d)=>renderSegmentation(d),
  products: (d)=>renderProducts(d),
  deposits: (d)=>renderDeposits(d),
  credit: (d)=>renderCredit(d),
  digital: (d,rg,dg)=>renderDigital(d,dg),
  fraud: (d)=>renderFraud(d),
  branches: (d)=>renderBranches(d),
  marketing: (d)=>renderMarketing(d),
  forecast: (d)=>renderForecast(d),
  scenarios: (d)=>renderScenarios(d),
};

let currentSection = "executive";

function renderNav(){
  const list = document.getElementById("nav-list");
  list.innerHTML = NAV.map(n=>`<div class="nav-item ${n.id===currentSection?'active':''}" data-id="${n.id}"><span class="nav-dot"></span>${n.label}</div>`).join("");
  list.querySelectorAll(".nav-item").forEach(el=>{
    el.addEventListener("click", ()=>{ currentSection = el.dataset.id; goToSection(currentSection); });
  });
}

function goToSection(id){
  const meta = NAV.find(n=>n.id===id);
  document.getElementById("section-title").textContent = meta.label;
  document.getElementById("section-subtitle").textContent = meta.sub;
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active", el.dataset.id===id));
  destroyCharts();
  const region = document.getElementById("filter-region").value;
  const digital = document.getElementById("filter-digital").value;
  RENDERERS[id](DASHBOARD_DATA, region, digital);
  appendFooter();
}

function populateFilters(){
  const rs = document.getElementById("filter-region");
  DASHBOARD_DATA.filters.regions.forEach(r=>{ const o=document.createElement("option"); o.value=r; o.textContent=r; rs.appendChild(o); });
  const ds = document.getElementById("filter-digital");
  DASHBOARD_DATA.filters.digital_segments.forEach(r=>{ const o=document.createElement("option"); o.value=r; o.textContent=r; ds.appendChild(o); });
  [rs,ds].forEach(sel=>sel.addEventListener("change", ()=>goToSection(currentSection)));
}
