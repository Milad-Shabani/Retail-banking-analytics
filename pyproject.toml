[project]
name = "retail-banking-analytics"
version = "1.0.0"
description = "End-to-end retail banking analytics case study: customer intelligence, financial performance, risk, churn and forecasting (synthetic data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milad Shabani" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pulp>=2.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
